name: Daily Scrobble
on:
  schedule:
    - cron: "30 19 * * *"  # 01:00 IST (UTC+5:30)
  
  workflow_dispatch:

jobs:

  scrobble:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository

        uses: actions/checkout@v6

      - name: Set up Python

        uses: actions/setup-python@v6

        with:

          python-version: "3.12"

      - name: Install uv

        uses: astral-sh/setup-uv@v6

      - name: Install dependencies

        run: uv sync

      - name: Run scrobbler

        env:

          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}

          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}

          LASTFM_USERNAME: ${{ secrets.LASTFM_USERNAME }}

          LASTFM_PASSWORD: ${{ secrets.LASTFM_PASSWORD }}

          # BROWSER AUTH

          BROWSER_JSON: ${{ secrets.BROWSER_JSON }}

          # OAUTH AUTH

          OAUTH_JSON: ${{ secrets.OAUTH_JSON }}

          YT_OAUTH_CLIENT_ID: ${{ secrets.YT_OAUTH_CLIENT_ID }}

          YT_OAUTH_CLIENT_SECRET: ${{ secrets.YT_OAUTH_CLIENT_SECRET }}

        run: uv run scrobble_daily.py
